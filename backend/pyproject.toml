[project]
name = "pm-backend"
version = "0.1.0"
description = "FastAPI backend for the project management MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "pytest>=9.1.1",
  "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
